name: Validate plugin

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Lint, unit tests, and build
        run: npm run check
      - name: Install browser and PDF tools
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y poppler-utils ghostscript zip
      - name: Validate preview and PDF output
        run: |
          node scripts/build-tests.mjs
          npx playwright test
      - name: Package installable plugin
        run: |
          node scripts/notices.mjs
          node scripts/package.mjs
      - name: Keep validation results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: print-validation
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Keep release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: print-studio-release
          path: |
            release/print-studio/main.js
            release/print-studio/manifest.json
            release/print-studio/styles.css
            print-studio-*.zip
          if-no-files-found: error
          retention-days: 14
